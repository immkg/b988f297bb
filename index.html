const ub=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
let data=null;
function params(){const o={};location.hash.slice(1).split('&').forEach(p=>{const i=p.indexOf('=');if(i>0)o[p.slice(0,i)]=p.slice(i+1)});return o}
function key(){return params().k||sessionStorage.getItem('k')}
function render(){
  const d=params().d==='packet'?'packet':'onepager';
  const html=data.docs[d];
  const doc=new DOMParser().parseFromString(html,'text/html');
  document.title=doc.title;
  document.head.querySelectorAll('style[data-doc]').forEach(e=>e.remove());
  doc.head.querySelectorAll('style').forEach(st=>{const s=document.createElement('style');s.dataset.doc='1';s.textContent=st.textContent;document.head.appendChild(s)});
  const k=key();const bar='<div class="bar"><a href="#k='+k+'&d=onepager" class="'+(d==='onepager'?'on':'')+'">One-page memo</a><a href="#k='+k+'&d=packet" class="'+(d==='packet'?'on':'')+'">Supporting packet</a><button id="dl">Download PDF</button></div>';
  document.body.innerHTML=bar+doc.body.innerHTML;
  document.getElementById('dl').onclick=()=>{const b=new Blob([ub(data.pdfs[d].replace(/\+/g,'-').replace(/\//g,'_'))],{type:'application/pdf'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=data.names[d];a.click()};
  document.querySelectorAll('a[href^="#s"],a[href="#contents"]').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.getElementById(a.getAttribute('href').slice(1));if(t)t.scrollIntoView()});
  if(!params().s) scrollTo(0,0);
}
async function boot(){
  const k=key(); if(!k){document.getElementById('msg').textContent='This link is missing its key.';return}
  try{
    sessionStorage.setItem('k',k);
    const ck=await crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(IV)},ck,Uint8Array.from(atob(CT),c=>c.charCodeAt(0)));
    data=JSON.parse(new TextDecoder().decode(pt));
    render(); addEventListener('hashchange',render);
  }catch(e){document.getElementById('msg').textContent='Could not open this page. Please use the full link you were sent.'}
}
boot();
